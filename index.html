<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evento da Pizza</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff7b00, #ffcc00);
  color: white;
  text-align: center;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 90%;
  max-width: 600px;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

h2 {
  font-size: 24px;
  margin-bottom: 35px;
}

#contador {
  font-size: 32px;
  font-weight: bold;
  line-height: 1.6;
}

.data {
  margin-top: 30px;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🍕 EVENTO DA PIZZA 🍕</h1>

<h2>A contagem regressiva começou!</h2>

<div id="contador">Carregando...</div>

<div class="data">
📅 06 de setembro de 2026<br>
⏰ 17:00 horas
</div>

</div>

<script>

const dataEvento = new Date("2026-09-06T17:00:00-03:00").getTime();

function atualizarContador() {

  const agora = new Date().getTime();
  const distancia = dataEvento - agora;

  if (distancia <= 0) {
    document.getElementById("contador").innerHTML =
      "🍕 É HORA DA PIZZA! 🍕";
    return;
  }

  const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
  const horas = Math.floor((distancia / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((distancia / (1000 * 60)) % 60);
  const segundos = Math.floor((distancia / 1000) % 60);

  document.getElementById("contador").innerHTML =
    dias + " dias<br>" +
    horas + " horas<br>" +
    minutos + " minutos<br>" +
    segundos + " segundos";
}

atualizarContador();
setInterval(atualizarContador, 1000);

</script>

</body>
</html>
